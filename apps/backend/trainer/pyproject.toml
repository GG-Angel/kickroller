[project]
name = "trainer"
version = "0.1.0"
description = "Kick onset detection for hardstyle tracks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pedalboard>=0.9.25",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["ruff>=0.16.10", "ty>=0.0.84"]

[project.scripts]
trainer = "src.cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["B008"]
