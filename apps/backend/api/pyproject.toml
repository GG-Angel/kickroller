[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.0",
    "loguru>=0.7.3",
    "obstore>=0.12.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
api = "api.main:run"

[dependency-groups]
dev = [
 "pytest>=9.2.0",
 "ruff>=0.16.10",
 "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]


[tool.alembic]
script_location = "%(here)s/alembic"
