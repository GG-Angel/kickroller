[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.0",
    "faststream-fastapi>=1.4.0",
    "faststream[rabbit]>=0.7.8",
    "loguru>=0.7.3",
    "obstore>=0.12.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
api = "api.main:run"

[dependency-groups]
dev = ["poethepoet>=0.49.0", "pytest>=9.2.0", "ruff>=0.16.10", "ty>=0.0.84"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]


[tool.alembic]
script_location = "%(here)s/alembic"

[[tool.alembic.post_write_hooks]]
name = "fix"
type = "console_scripts"
entrypoint = "poe"
options = "fix REVISION_SCRIPT_FILENAME"

[tool.poe.tasks]
test = { cmd = "pytest", help = "Run the tests" }
migrate = { cmd = "alembic upgrade head", help = "Apply migrations" }
revision = { cmd = "alembic revision --autogenerate -m", help = "Autogenerate a migration from the models" }
fix = { help = "Lint with fixes, then format", sequence = [
    { cmd = "ruff check --fix $POE_EXTRA_ARGS" },
    { cmd = "ruff format $POE_EXTRA_ARGS" },
] }
