# Sample bank for `analyzer generate`. Copy this file to bank.toml
# (git-ignored), set the root to your samples folder and list its files.
#
# "files" are globs of audio files relative to root: "*" stays in one folder
# and "**" also matches subfolders. "exclude" is a regular expression applied
# to file names. Each [[samples]] group has one kind; use separate groups when
# files need different kinds, BPMs, or exclusions.
#
# BPM defaults to 160. Set it once per group, so files with different tempos
# should be listed in separate groups.

root = "/path/to/samples" # a relative root is relative to this file

# Complete kick one-shots, one kick each.
[[samples]]
kind = "kick"
files = ["kicks/*", "kicks/pitched/*/*"]
exclude = "KICK_ROLL"                    # kick rolls have more than one kick

[[samples]]
kind = "kick"
files = ["kicks/raw/*_155.wav"]
bpm = 155

# Loops that start on a bar and have no kicks and no sub-bass: screeches,
# atmospheres, top loops, fills. Not drum loops or full mixes.
[[samples]]
kind = "loop"
files = ["loops/screeches/*", "loops/tops/*"]
exclude = '_(FULL|DRUMS|KICK|BASS)\.wav$'

[[samples]]
kind = "loop"
files = ["loops/150/*"]
bpm = 150

# Claps, put on beats 2 and 4.
[[samples]]
kind = "clap"
files = ["drums/claps/*"]
exclude = "KICK"          # kick and clap layers

# Impacts, crashes and sub drops, put at the start of a bar.
[[samples]]
kind = "impact"
files = ["fx/impacts/*", "fx/sub drops/*"]

# Other one-shots: snares, hats, percussion, FX, synth hits. No kick layers.
[[samples]]
kind = "hit"
files = ["drums/snares/*", "drums/hats/*", "fx/other/*"]
exclude = "KICK"
