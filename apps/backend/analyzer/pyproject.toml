[project]
name = "analyzer"
version = "0.1.0"
description = "Kick onset detection for rawstyle tracks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beat-this>=1.1.0",
    "librosa>=1.0.0",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyloudnorm>=0.2.0",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "typer>=0.27.2",
]

[project.scripts]
analyzer = "cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.9", "ty>=0.0.84"]
