name: kickroller

services:
  rustfs:
    image: rustfs/rustfs:1.0.5
    profiles: [infra, api]
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs/
    networks:
      - internal
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_AMQP_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_AMQP_URL_PRIMARY: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RUSTFS_NOTIFY_AMQP_EXCHANGE_PRIMARY: amq.direct
      RUSTFS_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: storage.events
      # Unroutable events are returned and retried instead of silently dropped.
      RUSTFS_NOTIFY_AMQP_MANDATORY_PRIMARY: "true"
      RUSTFS_NOTIFY_AMQP_PERSISTENT_PRIMARY: "true"
      # Buffers events on the data volume while RabbitMQ is unreachable.
      RUSTFS_NOTIFY_AMQP_QUEUE_DIR_PRIMARY: /data/.rustfs/events
    command: /data
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup: # Its queue must exist before events are published.
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  rustfs-setup:
    image: amazon/aws-cli:2.39.3
    profiles: [infra, api]
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./infra/rustfs:/config:ro
    networks:
      - internal
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["sh", "/config/setup.sh"]

  db:
    image: postgres:18-alpine
    profiles: [infra, api]
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: kickroller
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickroller"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine
    profiles: [infra, api]
    restart: unless-stopped
    hostname: rabbitmq # Ensures the data directory is correctly keyed to the node name
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  rabbitmq-setup:
    image: rabbitmq:4.4.1-management-alpine
    profiles: [infra, api]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infra/rabbitmq:/config:ro
    networks:
      - internal
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_USERNAME: ${RABBITMQ_USER}
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
    entrypoint: ["sh", "/config/setup.sh"]

  api-migration:
    image: kickroller-api
    profiles: [api]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql+asyncpg://kickroller:${POSTGRES_PASSWORD}@db:5432/kickroller

  api:
    image: kickroller-api
    profiles: [api]
    restart: unless-stopped
    depends_on:
      api-migration:
        condition: service_completed_successfully
      rustfs-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql+asyncpg://kickroller:${POSTGRES_PASSWORD}@db:5432/kickroller
      BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

volumes:
  postgres_data:
  rustfs-data:
  rustfs-logs:
  rabbitmq-data:

networks:
  external:
  internal:
    internal: true
