name: kickroller

services:
  rustfs:
    image: rustfs/rustfs:1.0.5
    profiles: [infra, api]
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs/
    networks:
      - internal
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
      RUSTFS_NOTIFY_ENABLE: "true"
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  rustfs-setup:
    image: amazon/aws-cli:2.39.3
    profiles: [infra, api]
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - internal
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["sh", "-c"]
    command:
      - aws s3api head-bucket --bucket kickroller || aws s3api create-bucket --bucket kickroller

  db:
    image: postgres:18-alpine
    profiles: [infra, api]
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: kickroller
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickroller"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-migration:
    image: kickroller-api
    profiles: [api]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql+asyncpg://kickroller:${POSTGRES_PASSWORD}@db:5432/kickroller

  api:
    image: kickroller-api
    profiles: [api]
    restart: unless-stopped
    depends_on:
      api-migration:
        condition: service_completed_successfully
      rustfs-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql+asyncpg://kickroller:${POSTGRES_PASSWORD}@db:5432/kickroller
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

volumes:
  postgres_data:
  rustfs-data:
  rustfs-logs:

networks:
  external:
  internal:
    internal: true
