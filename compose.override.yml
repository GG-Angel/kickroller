services:
  rustfs:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - external

  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - external

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # management UI
    networks:
      - external

  api-migration:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile

  api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9100:9100"
    networks:
      - external
    environment:
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      SERVER_SERVE_DOCS: "true"
