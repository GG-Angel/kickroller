services:
  rustfs:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - external
    environment:
      RUSTFS_ACCESS_KEY: mysecretaccesskey
      RUSTFS_SECRET_KEY: mysecretkey

  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - external
    environment:
      POSTGRES_PASSWORD: mysecretpassword

  api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - external
    environment:
      DATABASE_URL: postgresql://kickroller:mysecretpassword@db:5432/kickroller
