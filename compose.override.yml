services:
  rustfs:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - external
    environment:
      RUSTFS_ACCESS_KEY: mysecretaccesskey
      RUSTFS_SECRET_KEY: mysecretkey

  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - external
    environment:
      POSTGRES_PASSWORD: mysecretpassword
