services:
  rustfs:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - external

  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - external

  api-migrate:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile

  api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9100:9100"
    networks:
      - external
